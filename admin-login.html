<body class="admin-body admin-login-body"><main class="admin-login-shell"><a class="brand admin-login-brand" href="index.html"><span class="brand-name"><span class="brand-ky">Ky</span><span class="brand-rest">vora.id</span></span></a><section class="admin-login-card"><div class="admin-login-symbol">K</div><p class="admin-kicker">KYVORA / SECURE ACCESS</p><h1>Welcome <span>back.</span></h1><p class="admin-login-copy">Masuk untuk melanjutkan ke control center Kyvora.id.</p><form id="admin-login-form"><label class="admin-field">Email<input id="admin-email" type="email" autocomplete="username" placeholder="Email admin" required></label><label class="admin-field">Password<span class="admin-password-wrap"><input id="admin-password" type="password" autocomplete="current-password" placeholder="Masukkan password" required><button type="button" id="toggle-password" aria-label="Tampilkan password">◉</button></span></label><p class="admin-login-error" id="login-error" role="alert"></p><button class="admin-primary admin-login-submit" type="submit">Masuk ke dashboard <span>↗</span></button></form><div class="admin-login-foot"><span class="admin-login-dot"></span> ADMIN ACCESS <span>·</span> KYVORA.ID</div></section><a class="admin-login-back" href="index.html">← Kembali ke website</a></main>
<script>(()=>{const form=document.querySelector('#admin-login-form'),email=document.querySelector('#admin-email'),password=document.querySelector('#admin-password'),error=document.querySelector('#login-error'),toggle=document.querySelector('#toggle-password');toggle.addEventListener('click',()=>{password.type=password.type==='password'?'text':'password';toggle.setAttribute('aria-label',password.type==='password'?'Tampilkan password':'Sembunyikan password')});form.addEventListener('submit',async e=>{e.preventDefault();error.textContent='';const btn=form.querySelector('button[type="submit"]');btn.disabled=true;btn.textContent='Memverifikasi...';try{const raw=new TextEncoder().encode(email.value.trim().toLowerCase()+'|'+password.value),digest=await crypto.subtle.digest('SHA-256',raw),hash=[...new Uint8Array(digest)].map(x=>x.toString(16).padStart(2,'0')).join('');if(email.value.trim().toLowerCase()!=='leovbriansyh791@gmail.com'||hash!=='bc318e92c3031bf10e6424edd91f0e335d928f5b8a8a4db0f3dab24b4dabb3eb'){error.textContent='Email atau password tidak sesuai.';password.value='';password.focus();return}localStorage.setItem('kyvora_admin_session_v1',JSON.stringify({email:'leovbriansyh791@gmail.com',at:Date.now()}));const next=new URLSearchParams(location.search).get('next');location.replace(next&&['admin.html','admin-catalog.html','admin-testimonials.html'].includes(next)?next:'admin.html')}catch(err){error.textContent='Browser tidak mendukung verifikasi login ini. Coba browser terbaru.'}finally{btn.disabled=false;btn.innerHTML='Masuk ke dashboard <span>↗</span>'}})})();</script></body></html>
